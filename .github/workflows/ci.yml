name: CI/CD Pipeline – Full Stack Open

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # Exercise 11.3: Lint
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (part9)
        run: cd part9 && npm install
      - name: Run linter (part9)
        run: cd part9 && npm run lint

  # Exercise 11.4: Build
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (part9)
        run: cd part9 && npm install
      - name: Build TypeScript (part9)
        run: cd part9 && npm run build
      - name: Install dependencies (part14)
        run: cd part14 && npm install
      - name: Build Next.js (part14)
        run: cd part14 && npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: part9/build

  # Exercise 11.5: Test ALL parts in repository
  test:
    name: 🧪 Test (${{ matrix.part }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        part:
          - 'part8/library-backend'
          - 'part8/library-frontend'
          - 'part9'
          - 'part10'
          - 'part13'
          - 'part14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd ${{ matrix.part }} && npm install --legacy-peer-deps
      - name: Run tests for ${{ matrix.part }}
        run: cd ${{ matrix.part }} && npm test

  # Exercise 11.9: Versioning – only on master push
  tag_release:
    name: 🏷️ Tag Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true

  # Exercise 11.10: Deploy
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: part9/build
      - name: Deploy (placeholder)
        run: |
          echo "Deploying to production..."
          echo "Build SHA: ${{ github.sha }}"

  # Exercise 11.19: Notify on failure
  notify_failure:
    name: 📢 Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: failure()
    steps:
      - name: Notify failure
        run: |
          echo "Pipeline FAILED on branch ${{ github.ref }}"
          echo "Commit: ${{ github.sha }} by ${{ github.actor }}"
