name: CI/CD Pipeline – Full Stack Open Part 11

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # Exercise 11.3: Lint
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: part9/package-lock.json
      - name: Install dependencies
        run: cd part9 && npm ci
      - name: Run linter
        run: cd part9 && npm run lint

  # Exercise 11.4: Build
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: part9/package-lock.json
      - name: Install dependencies
        run: cd part9 && npm ci
      - name: Build TypeScript
        run: cd part9 && npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: part9/build

  # Exercise 11.5: Test
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd part9 && npm ci
      - name: Run tests
        run: cd part9 && npm test --if-present

  # Exercise 11.9: Versioning
  tag_release:
    name: 🏷️ Tag Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true

  # Exercise 11.10: Deploy
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: part9/build
      - name: Deploy (placeholder)
        run: |
          echo "Deploying to production..."
          echo "Build SHA: ${{ github.sha }}"

  # Exercise 11.19: Notify on failure
  notify_failure:
    name: 📢 Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: failure()
    steps:
      - name: Notify failure
        run: echo "Pipeline failed on ${{ github.ref }} – commit ${{ github.sha }} by ${{ github.actor }}"
